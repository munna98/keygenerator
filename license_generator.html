<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KolaBiz - Short Key Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">License Generator</h1>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Client Machine ID</label>
                <input id="machineId" type="text" placeholder="Paste ID (e.g. 5dc9a...)"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono text-sm" />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                    <select id="type" onchange="updateExpiryFromType()"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="7D">7 Days</option>
                        <option value="30">30 Days</option>
                        <option value="AN" selected>Annual</option>
                        <option value="LT">Lifetime</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Expiry Date</label>
                    <input id="expiry" type="date" onchange="onDateManualChange()"
                        class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
            </div>

            <button id="generateBtn" onclick="generateKey()"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Generate Short Key
            </button>

            <div id="resultContainer" class="hidden pt-4 border-t mt-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">License Key</label>
                <div class="relative">
                    <input id="result" readonly
                        class="w-full p-4 bg-green-50 border border-green-200 rounded-lg font-mono text-xl text-center tracking-widest text-green-800 font-bold" />
                </div>
                <button onclick="copyKey()"
                    class="mt-2 w-full bg-gray-200 text-gray-700 py-2 rounded font-medium hover:bg-gray-300">
                    Copy to Clipboard
                </button>
            </div>

            <p class="text-xs text-center text-gray-400 mt-4">Secret Key: KolaBiz_Secret_Key_2025_Secure</p>
        </div>
    </div>

    <script>
        const SECRET_KEY = "KolaBiz_Secret_Key_2025_Secure";

        function formatDateToInputValue(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function updateExpiryFromType() {
            const type = document.getElementById('type').value;
            const now = new Date();

            if (type === '7D') now.setDate(now.getDate() + 7);
            else if (type === '30') now.setDate(now.getDate() + 30);
            else if (type === 'AN') now.setFullYear(now.getFullYear() + 1);
            else if (type === 'LT') now.setFullYear(now.getFullYear() + 99);

            document.getElementById('expiry').value = formatDateToInputValue(now);
        }

        function onDateManualChange() {
            // Optional: User changed date manually. 
            // We could update 'Type' to 'Custom' but strict types are needed for the key format.
            // We KEEP the selected type (e.g. AN) but use the Custom Date.
            // This allows creating an "Annual" key that expires on a specific specific date.
        }

        function generateKey() {
            try {
                const machineId = document.getElementById('machineId').value.trim();
                const type = document.getElementById('type').value;
                const expiryInput = document.getElementById('expiry').value; // YYYY-MM-DD

                if (!machineId) {
                    alert("Please enter Machine ID");
                    return;
                }

                if (!expiryInput) {
                    alert("Please select an expiry date");
                    return;
                }

                // Parse Input Date => Code: DDMMYY
                const [yearFull, monthStr, dayStr] = expiryInput.split('-');
                const yearShort = yearFull.slice(-2);
                const dateCode = `${dayStr}${monthStr}${yearShort}`;

                // PAYLOAD: MACHINE_ID + TYPE + DATE
                const payload = `${machineId}${type}${dateCode}`;

                // HMAC-SHA256
                const hash = CryptoJS.HmacSHA256(payload, SECRET_KEY);
                const hashHex = CryptoJS.enc.Hex.stringify(hash);

                // Take first 8 chars
                const sig = hashHex.substring(0, 8).toUpperCase();

                // Final Key: TYPE-DATE-SIG
                const key = `${type}-${dateCode}-${sig}`;

                document.getElementById('result').value = key;
                document.getElementById('resultContainer').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
            }
        }

        function copyKey() {
            const key = document.getElementById('result');
            key.select();
            document.execCommand('copy');
            alert("Copied!");
        }

        // Init
        updateExpiryFromType();
    </script>
</body>

</html>
